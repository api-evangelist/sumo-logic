- basicAuth: []
tags:
- name: appManagementV2
  description: 'App installation API (V2).


    View and install Sumo Logic Applications that deliver out-of-the-box dashboards, saved searches, and field extraction for popular data sources. For more information, see [Sumo Logic Apps](https://help.sumologic.com/docs/integrations).

    '
  x-displayName: Apps V2 (Beta)
paths:
  /v2/apps/{uuid}/install:
    post:
      tags:
      - appManagementV2
      summary: Start App Install Job
      description: 'Schedule an asynchronous job to install the app with the given UUID and version from the App Catalog. The app will be installed in ''Installed Apps'' folder in the Content Library.


        _You get back an identifier of asynchronous job in response to this endpoint. You can then use the [app install status API](#operation/getAsyncInstallAppStatus) to get the status of the installation request. See [Asynchronous-Request](#section/Getting-Started/Asynchronous-Request) section for more details on how to work with asynchronous request._'
      operationId: asyncInstallApp
      parameters:
      - name: uuid
        in: path
        description: UUID of the app to install.
        required: true
        schema:
          type: string
        example: ceb7fac5-1127-4a04-a5b8-2e49190be3d5
      requestBody:
        description: Information about the app to install.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsyncInstallAppRequest'
        required: true
      responses:
        '200':
          description: App installation job has been scheduled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeginAsyncJobResponseV2'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/apps/install/{jobId}/status:
    get:
      tags:
      - appManagementV2
      summary: App Install Job Status
      description: Get the status of an asynchronous app install request for the given job identifier.
      operationId: getAsyncInstallAppStatus
      parameters:
      - name: jobId
        in: path
        description: Identifier of the asynchronous job for installing the app.
        required: true
        schema:
          type: string
        example: C03E086C137F38B4
      responses:
        '200':
          description: Status of the app installation job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncInstallAppJobStatus'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/apps/{uuid}/uninstall:
    post:
      tags:
      - appManagementV2
      summary: Start App Uninstall Job
      description: 'Schedule an asynchronous job to uninstall app with the given UUID.


        _You get back an identifier of asynchronous job in response to this endpoint. You can then use the [app uninstall status API](#operation/getAsyncUninstallAppStatus) to get the status of the uninstallation request. See [Asynchronous-Request](#section/Getting-Started/Asynchronous-Request) section for more details on how to work with asynchronous request._'
      operationId: asyncUninstallApp
      parameters:
      - name: uuid
        in: path
        description: UUID of the app to uninstall.
        required: true
        schema:
          type: string
        example: ceb7fac5-1127-4a04-a5b8-2e49190be3d5
      responses:
        '200':
          description: App uninstall job has been scheduled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeginAsyncJobResponseV2'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/apps/uninstall/{jobId}/status:
    get:
      tags:
      - appManagementV2
      summary: App Uninstall Job Status
      description: Get the status of an asynchronous app uninstall request for the given job identifier.
      operationId: getAsyncUninstallAppStatus
      parameters:
      - name: jobId
        in: path
        description: Identifier of the asynchronous job for uninstalling the app.
        required: true
        schema:
          type: string
        example: C03E086C137F38B4
      responses:
        '200':
          description: Status of the app uninstall job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncUninstallAppJobStatus'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/apps/{uuid}/upgrade:
    post:
      tags:
      - appManagementV2
      summary: Start App Upgrade Job
      description: 'Schedule an asynchronous job to upgrade the app with the given UUID and version from the App Catalog. The app will be installed in ''Installed Apps'' folder in the Content Library.


        _You get back an identifier of asynchronous job in response to this endpoint. You can then use the [app upgrade status API](#operation/getAsyncUpgradeAppStatus) to get the status of the upgrade request. See [Asynchronous-Request](#section/Getting-Started/Asynchronous-Request) section for more details on how to work with asynchronous request._'
      operationId: asyncUpgradeApp
      parameters:
      - name: uuid
        in: path
        description: UUID of the app to upgrade.
        required: true
        schema:
          type: string
        example: ceb7fac5-1127-4a04-a5b8-2e49190be3d5
      requestBody:
        description: Information about the app to upgrade.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsyncUpgradeAppRequest'
        required: true
      responses:
        '200':
          description: App upgrade job has been scheduled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeginAsyncJobResponseV2'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/apps/upgrade/{jobId}/status:
    get:
      tags:
      - appManagementV2
      summary: App Upgrade Job Status
      description: Get the status of an asynchronous app upgrade request for the given job identifier.
      operationId: getAsyncUpgradeAppStatus
      parameters:
      - name: jobId
        in: path
        description: Identifier of the asynchronous job for upgrading the app.
        required: true
        schema:
          type: string
        example: C03E086C137F38B4
      responses:
        '200':
          description: Status of the app upgrade job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncUpgradeAppJobStatus'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/apps:
    get:
      tags:
      - appManagementV2
      summary: List Apps
      description: List all apps from the App Catalog.
      operationId: listAppsV2
      parameters:
      - name: name
        in: query
        description: Name of the app.
        required: false
        schema:
          type: string
        example: AWS%20CloudTrail
      - name: author
        in: query
        description: Author of the app.
        required: false
        schema:
          type: string
        example: Sumo%20Logic
      responses:
        '200':
          description: List of apps.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAppsV2Response'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/apps/{uuid}/details:
    get:
      tags:
      - appManagementV2
      summary: Get Details Of An App Version.
      description: "Get details about an app with the given UUID and version. The details include:\n\n  1. The base URL for all the resource for the app.\n  2. The app manifest"
      operationId: getAppDetails
      parameters:
      - name: uuid
        in: path
        description: UUID of the app.
        required: true
        schema:
          type: string
        example: ceb7fac5-1127-4a04-a5b8-2e49190be3d5
      - name: version
        in: query
        description: Version of the app. The latest version is used if this is omitted or specified as "latest".
        required: false
        schema:
          type: string
        example: 1.0.0
      responses:
        '200':
          description: Information about the requested app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAppDetailsResponse'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/apps/{uuid}/subscription:
    get:
      tags:
      - appManagementV2
      summary: Get Subscription Status For The User
      description: Get Subscription status for the user for a specific app.  This will indicate whether the user has subscribed to the app or not.
      operationId: getAppNotificationSubscriptionStatus
      parameters:
      - name: uuid
        in: path
        description: UUID of the app.
        required: true
        schema:
          type: string
        example: ceb7fac5-1127-4a04-a5b8-2e49190be3d5
      responses:
        '200':
          description: Information about user's subscription status for the app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionStatusResponse'
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - appManagementV2
      summary: Subscribe To An App Upgrade Notification
      description: Subscribe to an app upgrade notification. This will allow the user to receive notifications for the app updates.
      operationId: subscribeToAppNotification
      parameters:
      - name: uuid
        in: path
        description: UUID of the app to subscribe to.
        required: true
        schema:
          type: string
        example: ceb7fac5-1127-4a04-a5b8-2e49190be3d5
      responses:
        '204':
          description: Successfully subscribed to the app notification.
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - appManagementV2
      summary: Unsubscribe From An App Upgrade Notification
      description: Unsubscribe from an app. This will remove the user's subscription to notifications for the app.
      operationId: unsubscribeFromAppNotification
      parameters:
      - name: uuid
        in: path
        description: UUID of the app to unsubscribe from.
        required: true
        schema:
          type: string
        example: ceb7fac5-1127-4a04-a5b8-2e49190be3d5
      responses:
        '204':
          description: App Notification unsubscription was successful.
        default:
          description: Operation failed with an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    GetAppDetailsResponse:
      required:
      - baseUrl
      - manifest
      - uuid
      - version
      type: object
      properties:
        uuid:
          type: string
          description: UUID of the app.
          format: uuid
          example: ceb7fac5-1127-4a04-a5b8-2e49190be3d5
        version:
          type: string
          description: Version of the app.
          example: 1.0.0
        baseUrl:
          type: string
          description: URL prefix for where the app is stored.
          format: url
          example: https://some_bucket.s3.amazonaws.com/path/to/app/version/
        manifest:
          type: string
          description: Content of the manifest YAML file, as Base64-encoded string.
          format: byte
        config:
          type: string
          description: Content of the config YAML file, as Base64-encoded string.
          format: byte
        readme:
          type: string
          description: Content of the README markdown file, as Base64-encoded string.
          format: byte
        files:
          maxProperties: 100
          type: object
          additionalProperties:
            type: string
            format: byte
          description: Content of various files part of app package, as Base64-encoded string.
          example:
