    ErrorResponse:
      required:
      - errors
      - id
      type: object
      properties:
        id:
          type: string
          description: An identifier for the error; this is unique to the specific API request.
          example: IUUQI-DGH5I-TJ045
        errors:
          type: array
          description: A list of one or more causes of the error.
          example:
          - code: auth:password_too_short
            message: Your password was too short.
          - code: auth:password_character_classes
            message: Your password did not contain any non-alphanumeric characters
          items:
            $ref: '#/components/schemas/ErrorDescription'
    SubscriptionStatusResponse:
      required:
      - status
      type: object
      properties:
        status:
          type: boolean
          description: Show if the user has subscribed to the app or not. value is true, if the user has subscribed to the app
          example: true
      description: Subscription Status
    AsyncUpgradeAppJobStatus:
      required:
      - status
      type: object
      properties:
        status:
          type: string
          description: Whether or not the request is in progress (`InProgress`), has completed successfully (`Success`), or has completed with an error (`Failed`).
          example: Success
        instanceId:
          type: string
          description: Instance identifier of the upgraded app. This field is not set yet but is a placeholder for future use.
          example: 0000000001578BE8
        path:
          type: string
          description: Path of the folder in which the app was upgraded.
          example: /Library/Installed Apps/AWS CloudTrail
        folderId:
          type: string
          description: Identifier of the folder in which the app was upgraded.
          example: 0000000001578BE8
        error:
          $ref: '#/components/schemas/ErrorDescription'
      description: Status of the upgrade app async job.
    AsyncInstallAppRequest:
      type: object
      properties:
        version:
          type: string
          description: 'Version of the app to install. You can either specify a specific version of the app or use `latest` to install the latest version of the app. _If version is not specified, the latest version of the app will be installed_.

            '
          example: 1.0.1
          default: latest
        parameters:
          maxProperties: 1000
          type: object
          additionalProperties:
            type: string
          description: Map of additional parameters for the app installation.
          example:
            db_system: redis
      description: Install app request.
    AsyncUpgradeAppRequest:
      type: object
      properties:
        version:
          type: string
          description: 'Version of the app to upgrade. You can either specify a specific version of the app or use `latest` to install the latest version of the app. _If version is not specified, the latest version of the app will be installed_.

            '
          example: 1.0.1
          default: latest
        parameters:
          maxProperties: 1000
          type: object
          additionalProperties:
            type: string
          description: Map of additional parameters for the app installation.
          example:
            db_system: redis
      description: Upgrade app request.
    ErrorDescription:
      required:
      - code
      - message
      type: object
      properties:
        code:
          type: string
          description: An error code describing the type of error.
          example: auth:password_too_short
        message:
          type: string
          description: A short English-language description of the error.
          example: Your password was too short.
        detail:
          type: string
          description: An optional fuller English-language description of the error.
          example: Your password was 5 characters long, the minimum length is 12 characters. See http://example.com/password for more information.
        meta:
          type: object
          description: An optional list of metadata about the error.
          example:
            minLength: 12
            actualLength: 5
    ListAppsV2Response:
      required:
      - apps
      type: object
      properties:
        apps:
          type: array
          description: An array of apps.
          items:
            $ref: '#/components/schemas/AppV2'
      description: List of all apps from the apps
    AsyncUninstallAppJobStatus:
      required:
      - status
      type: object
      properties:
        status:
          type: string
          description: Whether or not the request is in progress (`InProgress`), has completed successfully (`Success`), or has completed with an error (`Failed`).
          example: Success
        errors:
          type: array
          description: More information about the failure if the status is `Failed`.
          items:
            $ref: '#/components/schemas/ErrorDescription'
      description: Status of an uninstall app job.
    AppV2:
      required:
      - accountTypes
      - attributes
      - author
      - beta
      - description
      - family
      - icon
      - installable
      - latestVersion
      - name
      - showOnMarketplace
      - uuid
      type: object
      properties:
        uuid:
          type: string
          description: UUID of the app.
          example: ceb7fac5-1127-4a04-a5b8-2e49190be3d5
        name:
          type: string
          description: Name of the app.
          example: AWS CloudTrail
        description:
          type: string
          description: Description of the app.
          example: AWS CloudTrail app description
        latestVersion:
          type: string
          description: Latest version of the app.
          example: 1.1.0
        icon:
          type: string
          description: URL of the icon for the app.
          example: https://some-bucket.s3.amazonaws.com/AWSCloudTrail.png
        author:
          type: string
          description: Author of the app.
          example: Sumo Logic
        accountTypes:
          type: array
          description: Account types of which the app is available to.
          example:
          - All
          items:
            type: string
        beta:
          type: boolean
          description: Whether the app is in beta.
          example: false
        installs:
          type: integer
          description: Number of times the app was installed.
          format: int32
          example: 3452
        attributes:
          maxProperties: 3
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: A map of attributes for this app. Attributes allow to group apps based on different criteria.
          example:
            category:
            - Web Server
            - IT Infrastructure
            - Amazon Web Services
            useCase:
            - security
            - observability
            collection:
            - OpenTelemetry
        installable:
          type: boolean
          description: Whether the app is installable or not as not all apps are installable.
          example: true
        showOnMarketplace:
          type: boolean
          description: Whether the app should show up on sumologic.com/applications webpage.
          example: true
        modifiedAt:
          type: string
          description: The timestamp in UTC of the most recent modification of the app.
          format: date-time
          example: 2018-10-16 09:10:00+00:00
      description: An app object.
    BeginAsyncJobResponseV2:
      required:
      - jobId
      type: object
      properties:
        jobId:
          type: string
          description: Identifier of the asynchronous job. Use it to get status of the job.
          example: C03E086C137F38B4
    AsyncInstallAppJobStatus:
      required:
      - status
      type: object
      properties:
        status:
          type: string
          description: Whether or not the request is in progress (`InProgress`), has completed successfully (`Success`), or has completed with an error (`Failed`).
          example: Success
        instanceId:
          type: string
          description: Instance identifier of the installed app. This field is not set yet but is a placeholder for future use.
          example: 0000000001578BE8
        path:
          type: string
          description: Path of the folder in which the app was installed.
          example: /Library/Installed Apps/AWS CloudTrail
        folderId:
          type: string
          description: Identifier of the folder in which the app was installed.
          example: 0000000001578BE8
        error:
          $ref: '#/components/schemas/ErrorDescription'
      description: Status of the install app async job.
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
