            items:
              type: string
          children:
            type: array
            description: 'Children of the folder. NOTE: Permissions field will not be filled (empty list) for children.'
            items:
              $ref: '#/components/schemas/MutingSchedulesLibraryBaseResponse'
    MutingSchedulesLibraryBase:
      required:
      - name
      - type
      type: object
      properties:
        name:
